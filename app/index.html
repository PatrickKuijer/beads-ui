<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beads</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell-root">
      <div id="sidebar" class="sidebar" aria-label="Primary"></div>
      <div class="app-main">
        <header class="app-header">
          <div class="header-title">
            <span class="app-title">Beads</span>
            <div id="workspace-picker" class="header-workspace"></div>
          </div>
          <nav id="top-nav" class="header-nav" aria-label="Primary"></nav>
          <div id="header-controls" class="header-controls"></div>
          <div class="header-actions">
            <div
              id="header-loading"
              class="header-loading"
              role="status"
              aria-live="polite"
              aria-label="Loading"
              hidden
            >
              <span class="header-loading__spinner" aria-hidden="true"></span>
              <span class="visually-hidden">Loading</span>
            </div>
            <button
              id="new-issue-btn"
              type="button"
              aria-haspopup="dialog"
              title="Create a new issue (Ctrl/Cmd+N)"
            >
              New issue
            </button>
          </div>
        </header>
        <main id="app" class="app-shell" aria-live="polite"></main>
      </div>
    </div>
    <script type="module" src="/main.bundle.js"></script>
  </body>
</html>
